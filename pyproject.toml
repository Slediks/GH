[project]
name = "gamehub"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = [
  "Flask==3.1.1", "SQLAlchemy==2.0.41", "alembic==1.16.2",
  "psycopg[binary]==3.2.9", "redis==6.2.0", "Flask-SocketIO==5.5.1",
  "gunicorn==23.0.0", "requests==2.32.4", "Pillow==11.2.1"
]
[project.optional-dependencies]
dev = ["pytest==8.4.1", "ruff==0.12.0", "pip-tools==7.4.1", "websocket-client==1.8.0"]
[tool.setuptools.packages.find]
include = ["backend*", "shared*", "simulation*"]
[tool.pytest.ini_options]
testpaths = ["backend/tests", "simulation/tests"]
pythonpath = ["."]
[tool.ruff]
line-length = 100
target-version = "py311"
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
