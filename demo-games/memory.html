<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Парные карточки</title>
<style>body{background:#0f1a23;color:#ebf4fb;font:16px Segoe UI;text-align:center;margin:24px}#board{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;max-width:440px;margin:24px auto}button{background:#1b2f3d;border:1px solid #3e5d74;color:#9edcff;border-radius:10px;padding:16px;cursor:pointer}#board button{aspect-ratio:1;font-size:30px;padding:0}.found{background:#1f4f67}h1{font-size:24px}</style>
<h1>Парные карточки</h1><p id="status">Ходов: 0</p><div id="board"></div><button id="reset">Новая игра</button><script>
let opened=[],moves=0,found=0,locked=false,generation=0;const symbols=['◆','●','▲','★','☀','♣','♥','☂'];
function reset(){generation++;opened=[];moves=found=0;locked=false;const board=document.querySelector('#board');board.replaceChildren();document.querySelector('#status').textContent='Ходов: 0';const values=[...symbols,...symbols];for(let i=values.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[values[i],values[j]]=[values[j],values[i]]}values.forEach((symbol,index)=>{const b=document.createElement('button');b.textContent='?';b.setAttribute('aria-label','Карточка '+(index+1));b.onclick=()=>{if(locked||b.disabled||opened.some(c=>c.b===b))return;b.textContent=symbol;opened.push({b,symbol});if(opened.length===2){moves++;locked=true;const current=generation;if(opened[0].symbol===symbol){opened.forEach(c=>{c.b.disabled=true;c.b.className='found'});found+=2;opened=[];locked=false}else setTimeout(()=>{if(current!==generation)return;opened.forEach(c=>c.b.textContent='?');opened=[];locked=false},700);document.querySelector('#status').textContent=found===16?'Все пары найдены! Ходов: '+moves:'Ходов: '+moves}};board.append(b)})}document.querySelector('#reset').onclick=reset;reset();
</script></html>
